# Eingegangen, "Das Haus gegenüber": a private S3 bucket and a small API behind one CloudFront
# distribution. Deployed by CI (.github/workflows/eingegangen.yml) as stack "eingegangen-app" in
# us-east-1 (CloudFront certificates must live there, so the whole stack does).
#   /*      the page, built by eingegangen/infra/build.sh, from S3
#   /api/*  the Lambda in eingegangen/api/, which keeps candles and windows in DynamoDB
# The function's code here is a placeholder; CI uploads the real code right after the stack.
# Without DomainName the site is served from the CloudFront domain in the outputs. With DomainName
# it gets a certificate; add HostedZoneId when the zone is in Route 53 and the stack validates the
# certificate and creates the records itself. Otherwise (dmrschmidt.de is at iwantmyname) the first
# deploy pauses at the certificate: copy the validation CNAME from the stack events (or
# `aws acm describe-certificate`) to the DNS provider, and once the stack is complete point
# DomainName at the distribution with a CNAME.
AWSTemplateFormatVersion: "2010-09-09"
Description: eingegangen website bucket, API function, table, CloudFront distribution and optional custom domain

Parameters:
  DomainName:
    Type: String
    Default: ""
    Description: e.g. eingegangen.dmrschmidt.de. Empty = CloudFront domain only.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 zone of DomainName, if any, for certificate validation and the alias records.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasZone: !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub eingegangen-site-${AWS::AccountId}
      OwnershipControls:
        Rules: [ { ObjectOwnership: BucketOwnerEnforced } ]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # Only this distribution may read the bucket.
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: eingegangen-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # One row per window somebody lit a candle in or moved into. pk = tile "K#tx#ty", sk = "col#floor".
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: eingegangen-fenster
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  ApiLog:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/eingegangen-api
      RetentionInDays: 30

  Api:
    Type: AWS::Lambda::Function
    DependsOn: ApiLog
    Properties:
      FunctionName: eingegangen-api
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      # made by hand in eingegangen/infra/github-deploy.yml
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/eingegangen-api
      Environment:
        Variables: { TABELLE: !Ref Table }
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 503, headers: { 'content-type': 'application/json' }, body: '{"fehler":"noch nicht da"}' });

  # CloudFront reaches the function through its URL. Public function URLs need both permissions.
  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Api.Arn
      AuthType: NONE
  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Api
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Api
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasZone
        - [ { DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId } ]
        - !Ref AWS::NoValue

  # /dir → /dir/index.html, so deep links to folders work.
  UrlFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: eingegangen-site-urls
      AutoPublish: true
      FunctionConfig: { Comment: directory index, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          if (req.uri.endsWith('/')) req.uri += 'index.html';
          else if (req.uri.lastIndexOf('.') < req.uri.lastIndexOf('/')) req.uri += '/index.html';
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: eingegangen
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref Certificate, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            # https://<id>.lambda-url.<region>.on.aws/ → host only
            DomainName: !Select [2, !Split ["/", !GetAtt ApiUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [ GET, HEAD ]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [ GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE ]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        # These also replace 403 and 404 answers from /api/*, so the API never sends those.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }

  Records:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Description: CNAME target for DomainName when the zone is not in Route 53
    Value: !GetAtt Distribution.DomainName
  Url:
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
