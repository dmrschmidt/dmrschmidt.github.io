# GitHub Actions → AWS roles for Eingegangen. Deploy BY HAND, once, in us-east-1:
#   eingegangen/infra/aws cloudformation deploy \
#     --stack-name eingegangen-github-deploy --template-file eingegangen/infra/github-deploy.yml \
#     --capabilities CAPABILITY_NAMED_IAM \
#     [--parameter-overrides ExistingOidcProviderArn=arn:aws:iam::<acct>:oidc-provider/token.actions.githubusercontent.com]
# Then set the repo variables from the outputs. Never deployed by CI: CI must not be able to
# edit its own trust policy, nor what the API function may do. Same shape as overslam's, scoped to eingegangen-*.
AWSTemplateFormatVersion: "2010-09-09"
Description: eingegangen GitHub OIDC deploy role, CloudFormation execution role and API function role

Parameters:
  # GitHub's OIDC subject, in both spellings: by name, and immutable (owner@id/repo@id), which survives renames.
  # Which one this repo sends: gh api repos/dmrschmidt/dmrschmidt.github.io/actions/oidc/customization/sub
  Repo:
    Type: String
    Default: dmrschmidt/dmrschmidt.github.io
  RepoById:
    Type: String
    Default: dmrschmidt@69365/dmrschmidt.github.io@268107824
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: ARN of an existing token.actions.githubusercontent.com provider (one per account). Empty = create one.

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # What the API function may do at run time: read and write its table, write its log.
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eingegangen-api
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: eingegangen-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ dynamodb:Query, dynamodb:UpdateItem ]
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/eingegangen-fenster
              - Effect: Allow
                Action: [ logs:CreateLogStream, logs:PutLogEvents ]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/eingegangen-api:*

  # What CloudFormation itself may touch for eingegangen/infra/app.yml.
  CfnExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eingegangen-cfn-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: eingegangen-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:*
                Resource: [ "arn:aws:s3:::eingegangen-*", "arn:aws:s3:::eingegangen-*/*" ]
              - Effect: Allow
                Action: dynamodb:*
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/eingegangen-*
              - Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:eingegangen-*
              - Effect: Allow
                Action: logs:*
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/eingegangen-*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              # hand the function its role; CloudFormation cannot create or change roles
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ApiRole.Arn
                Condition:
                  StringEquals: { iam:PassedToService: lambda.amazonaws.com }
              # CloudFront, ACM and Route 53 resources carry no project name at create time
              - Effect: Allow
                Action: [ cloudfront:*, acm:*, route53:GetChange, route53:GetHostedZone, route53:ListHostedZones, route53:ListResourceRecordSets, route53:ChangeResourceRecordSets ]
                Resource: "*"

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eingegangen-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidc, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${Repo}:ref:refs/heads/main
                  - !Sub repo:${RepoById}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-eingegangen
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/eingegangen-*/*
              - Effect: Deny
                Action: cloudformation:*
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/eingegangen-github-deploy/*
              - Effect: Allow
                Action: [ cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary ]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecRole.Arn
                Condition:
                  StringEquals: { iam:PassedToService: cloudformation.amazonaws.com }
              # upload the site, swap the function code and flush the cache
              - Effect: Allow
                Action: [ s3:ListBucket, s3:PutObject, s3:DeleteObject, s3:GetObject ]
                Resource: [ !Sub "arn:aws:s3:::eingegangen-site-${AWS::AccountId}", !Sub "arn:aws:s3:::eingegangen-site-${AWS::AccountId}/*" ]
              - Effect: Allow
                Action: [ lambda:UpdateFunctionCode, lambda:GetFunction, lambda:GetFunctionConfiguration ]
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:eingegangen-api
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*

Outputs:
  DeployRoleArn:
    Description: repo variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  CfnExecRoleArn:
    Description: repo variable AWS_CFN_EXEC_ROLE_ARN
    Value: !GetAtt CfnExecRole.Arn
