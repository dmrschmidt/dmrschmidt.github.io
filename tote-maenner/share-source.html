<!doctype html>
<!-- Vorlage für share.jpg (1200×630). Neu rendern:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=6000 --screenshot=share.png share-source.html
     magick share.png -quality 86 share.jpg -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Share-Bild</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,700,100,1&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; color: #f1ead6; font-family: Fraunces, Georgia, serif;
    background: radial-gradient(900px 420px at 60% 112%, #ffd27acc, #c9762a55 40%, transparent 72%), #12231a; }
  h1 { position: absolute; left: 64px; top: 52px; margin: 0; width: 700px; font-size: 104px; line-height: .94; font-weight: 700; letter-spacing: -.025em; font-variation-settings: "SOFT" 100, "WONK" 1; }
  .augen { position: absolute; right: 70px; top: 56px; display: flex; gap: 12px; }
  .augen i { position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #e9e6dc); box-shadow: inset -9px -12px 0 #0002, 0 8px 22px #0006; }
  .augen i::after { content: ""; position: absolute; inset: 27%; border-radius: 50%; background: #111; transform: translate(-28%, 48%); }
  .reihe { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: flex-end; gap: 6px; }
  .reihe img { height: 268px; max-width: 190px; object-fit: contain; object-position: bottom; filter: drop-shadow(0 0 24px #ffd27a55); }
</style>
</head>
<body>
  <h1>Sieben Töpfe sind jetzt leer.</h1>
  <div class="augen"><i></i><i></i></div>
  <div class="reihe">
    <img src="sticker/der-kleine.webp" alt="" style="height: 190px">
    <img src="sticker/tingeltangel-mann.webp" alt="">
    <img src="sticker/der-stachelige.webp" alt="" style="height: 200px">
    <img src="sticker/senor-kartoffelkopf.webp" alt="" style="max-width: 230px">
    <img src="sticker/der-mann.webp" alt="" style="height: 230px">
    <img src="sticker/ted-und-ned.webp" alt="">
    <img src="sticker/goennjamin.webp" alt="" style="height: 220px">
  </div>
</body>
</html>
