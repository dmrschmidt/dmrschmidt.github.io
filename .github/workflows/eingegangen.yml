name: eingegangen

on:
  workflow_dispatch:
  pull_request:
    paths: [ "eingegangen/**", "tote-maenner/pflanzen.js", "tote-maenner/sticker/**", "tote-maenner/img/**", ".github/workflows/eingegangen.yml" ]
  push:
    branches: [ main ]
    paths: [ "eingegangen/**", "tote-maenner/pflanzen.js", "tote-maenner/sticker/**", "tote-maenner/img/**", ".github/workflows/eingegangen.yml" ]

concurrency:
  group: eingegangen-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  STACK: eingegangen-app
  FUNCTION: eingegangen-api
  # Custom domain: set both repo variables (EINGEGANGEN_DOMAIN, EINGEGANGEN_ZONE_ID), only the domain
  # (DNS elsewhere), or neither.
  DOMAIN: ${{ vars.EINGEGANGEN_DOMAIN }}
  ZONE: ${{ vars.EINGEGANGEN_ZONE_ID }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pipx install cfn-lint
      - run: cfn-lint eingegangen/infra/*.yml
      - run: node --test eingegangen/api/index.test.mjs
      - run: eingegangen/infra/build.sh
      - run: npx --yes html-validate@9 dist/eingegangen/*.html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: stack
        env:
          EXEC_ROLE: ${{ vars.AWS_CFN_EXEC_ROLE_ARN }}
        run: |
          set -euo pipefail
          status=$(aws cloudformation describe-stacks --stack-name "$STACK" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NONE)
          if [ "$status" = ROLLBACK_COMPLETE ]; then # a failed first create owns nothing; drop it
            aws cloudformation delete-stack --stack-name "$STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          fi
          aws cloudformation deploy --stack-name "$STACK" --template-file eingegangen/infra/app.yml \
            --role-arn "$EXEC_ROLE" --no-fail-on-empty-changeset \
            --parameter-overrides "DomainName=$DOMAIN" "HostedZoneId=$ZONE" || {
            aws cloudformation describe-stack-events --stack-name "$STACK" --max-items 30 \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[LogicalResourceId, ResourceStatusReason]" --output text
            exit 1
          }
      - name: api
        run: |
          set -euo pipefail
          (cd eingegangen/api && zip -q -X ../../api.zip index.mjs)
          aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://api.zip > /dev/null
          aws lambda wait function-updated --function-name "$FUNCTION"
      - name: upload
        run: |
          set -euo pipefail
          out() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          eingegangen/infra/build.sh
          bucket=$(out BucketName)
          # pictures rarely change: cache a week; html/css/js: revalidate every few minutes
          aws s3 sync dist/eingegangen/ "s3://$bucket" --delete --exclude "*" --include "sticker/*" --include "img/*" --cache-control "public, max-age=604800"
          aws s3 sync dist/eingegangen/ "s3://$bucket" --delete --exclude "sticker/*" --exclude "img/*" --cache-control "public, max-age=300"
          aws cloudfront create-invalidation --distribution-id "$(out DistributionId)" --paths "/*" > /dev/null
          echo "deployed to $(out Url)"
          # the API answers through CloudFront (asked by its own domain: a custom one may not point here yet)
          curl -fsS "https://$(out DistributionDomain)/api/kachel/0/0" | grep -q '"fenster"'
